<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCAD-Dev System Context</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--sans:'Geist',sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',monospace}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1100px;width:100%}
.eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;color:var(--ink);margin-bottom:1rem}
svg{width:100%;min-width:820px;display:block}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">System Context · Diagram Design</p>
<h1>TCAD-Dev system context</h1>
<svg viewBox="0 0 1040 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ctx-title ctx-desc">
<title id="ctx-title">TCAD-Dev system context</title>
<desc id="ctx-desc">System context diagram showing a user interacting with the TCAD-Dev desktop application, which reads and writes project/result files and depends on external numerical and GUI libraries.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- arrows first -->
<line x1="248" y1="180" x2="360" y2="180" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="264" y="160" width="80" height="12" rx="2" fill="#f5f5f5"/>
<text x="304" y="169" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">INTERACTS</text>

<line x1="760" y1="180" x2="872" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="772" y="160" width="88" height="12" rx="2" fill="#f5f5f5"/>
<text x="816" y="169" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">READ/WRITE</text>

<path d="M 560,244 V 288 Q 560,296 552,296 H 508" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="516" y="264" width="88" height="12" rx="2" fill="#f5f5f5"/>
<text x="560" y="273" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">DEPENDS ON</text>

<!-- User -->
<rect x="40" y="148" width="208" height="64" rx="6" fill="#f5f5f5"/>
<rect x="40" y="148" width="208" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<rect x="48" y="156" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
<text x="62" y="165" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">EXT</text>
<text x="144" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">User</text>
<text x="144" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">device/process engineer</text>

<!-- Application (FOCAL) -->
<rect x="360" y="148" width="400" height="64" rx="6" fill="#f5f5f5"/>
<rect x="360" y="148" width="400" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="368" y="156" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
<text x="382" y="165" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">APP</text>
<text x="560" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">TCAD-Dev desktop application</text>
<text x="560" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">GUI · solver subprocess · optional MPI pool (§4)</text>

<!-- Files store -->
<rect x="872" y="148" width="128" height="64" rx="6" fill="#f5f5f5"/>
<rect x="872" y="148" width="128" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="880" y="156" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
<text x="894" y="165" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">OUT</text>
<text x="936" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Project / result</text>
<text x="936" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">.tcadproj · .npz · .json</text>

<!-- External libraries -->
<rect x="304" y="296" width="256" height="64" rx="6" fill="#f5f5f5"/>
<rect x="304" y="296" width="256" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<rect x="312" y="304" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
<text x="328" y="313" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">EXT</text>
<text x="432" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">External libraries</text>
<text x="432" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Qt6/PySide6 · NumPy/SciPy · PyVista (hard) ·</text>
<text x="432" y="358" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">gmsh · devsim · pyamg · CuPy · mpi4py (soft, §2.3)</text>

<!-- legend -->
<line x1="40" y1="384" x2="1000" y2="384" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="400" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".18em">LEGEND</text>
<rect x="40" y="404" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="60" y="412" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">This application</text>
<rect x="220" y="404" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="240" y="412" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">External / library</text>
<line x1="420" y1="409" x2="448" y2="409" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="456" y="412" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Dependency (soft or hard)</text>
</svg>
</div>
</body>
</html>
