<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newton Solver Loop</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--sans:'Geist',sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',monospace}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:680px;width:100%}
.eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;color:var(--ink);margin-bottom:.5rem}
.sub{font-family:var(--serif);font-style:italic;font-size:.85rem;color:var(--muted);margin-bottom:1rem}
svg{width:100%;min-width:520px;display:block}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Flowchart · Diagram Design</p>
<h1>Newton &#8211; Jacobian &#8211; linear solver iteration</h1>
<p class="sub">Device3D only: the linear-solve step catches LinearSolveError from an iterative method and retries once with "direct" for that iterate only (&#167;8.5).</p>
<svg viewBox="0 0 620 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="newton-title newton-desc">
<title id="newton-title">Newton-Jacobian-linear-solver iteration</title>
<desc id="newton-desc">Flowchart of one Newton solve: a one-time engine selection before the loop, then repeated residual/Jacobian assembly, linear solve, damped update, and a convergence check that either loops back or returns.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- arrows -->
<line x1="340" y1="96" x2="340" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="192" x2="340" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="296" x2="340" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="400" x2="340" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="496" x2="340" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="340" y1="624" x2="340" y2="680" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="352" y="640" width="36" height="12" rx="2" fill="#f5f5f5"/>
<text x="370" y="649" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">YES</text>

<path d="M 240,580 H 108 Q 100,580 100,572 V 272 Q 100,264 108,264 H 200"
      fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="154" y="560" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="174" y="569" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">NO</text>

<!-- Node 1: Select engine (once, dashed = one-time setup) -->
<rect x="200" y="40" width="280" height="56" rx="6" fill="#f5f5f5"/>
<rect x="200" y="40" width="280" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="340" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Select linear-solve engine</text>
<text x="340" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">ONCE, by node_count (&#167;8.6) &#8212; not per iterate</text>

<!-- Node 2: Initial guess -->
<rect x="200" y="136" width="280" height="56" rx="6" fill="#f5f5f5"/>
<rect x="200" y="136" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="340" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Initial guess</text>
<text x="340" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">&#968; (equilibrium) or &#968;,n,p (bias)</text>

<!-- Node 3: Assemble F,J (FOCAL, loop entry) -->
<rect x="200" y="232" width="280" height="64" rx="6" fill="#f5f5f5"/>
<rect x="200" y="232" width="280" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="208" y="240" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
<text x="222" y="249" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">ITR</text>
<text x="340" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Assemble residual F, Jacobian J</text>
<text x="340" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">_residual_jacobian() &#8212; analytic, per iterate</text>

<!-- Node 4: Linear solve (FOCAL) -->
<rect x="200" y="336" width="280" height="64" rx="6" fill="#f5f5f5"/>
<rect x="200" y="336" width="280" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="208" y="344" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
<text x="222" y="353" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">LIN</text>
<text x="340" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Solve J&#183;&#916;x = &#8722;F</text>
<text x="340" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">linsolve.solve_linear() &#8212; one-way call</text>

<!-- Node 5: Apply update -->
<rect x="200" y="440" width="280" height="56" rx="6" fill="#f5f5f5"/>
<rect x="200" y="440" width="280" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="340" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Apply damped update</text>
<text x="340" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">clip &#916;&#968; to max_dpsi; clamp n,p to 0.1&#215;-10&#215;</text>

<!-- Decision diamond -->
<polygon points="340,536 440,580 340,624 240,580" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
<text x="340" y="574" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Converged?</text>
<text x="340" y="590" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">max(|&#916;&#968;|,rel_n,rel_p)&lt;tol_update</text>

<!-- Node 7: Return -->
<rect x="200" y="680" width="280" height="56" rx="6" fill="#f5f5f5"/>
<rect x="200" y="680" width="280" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="340" y="704" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Return state</text>
<text x="340" y="720" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">or warn at max_iter (100) &#8212; never raises</text>

<!-- legend -->
<line x1="40" y1="772" x2="580" y2="772" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="788" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".18em">LEGEND</text>
<rect x="40" y="800" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="60" y="808" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Per-iterate step</text>
<rect x="200" y="800" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
<text x="220" y="808" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">One-time setup (before loop)</text>
<rect x="420" y="800" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="440" y="808" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">State transform</text>
</svg>
</div>
</body>
</html>
