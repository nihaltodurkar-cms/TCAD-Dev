<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tcad-arch-v-title tcad-arch-v-desc">
      <title id="tcad-arch-v-title">TCAD-Dev simulation architecture (verified)</title>
      <desc id="tcad-arch-v-desc">Architecture diagram showing the PyTCAD Qt/QML GUI process spawning a solver subprocess that builds a mesh and material physics, runs 2D/3D Newton device solvers backed by a linear algebra module, optionally delegates large 3D jobs to an MPI/Schwarz worker pool, writes results to an npz store, and renders them back through a visualization pipeline into the QML UI.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== ZONES (bg -> zones -> arrows -> nodes) ===== -->
      <rect x="40" y="64" width="1080" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="532" y="68" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GUI PROCESS</text>

      <rect x="40" y="280" width="1080" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="512" y="284" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="580" y="293" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SOLVER SUBPROCESS</text>

      <!-- ===== ARROWS ===== -->

      <!-- RUN: QML -> App Layer (same y, straight, accent = primary flow) -->
      <line x1="304" y1="128" x2="856" y2="128" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="548" y="108" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="117" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN</text>

      <!-- JOB.JSON: App Layer -> Mesh (dashed, crosses process boundary) -->
      <path d="M 910,160 V 228 Q 910,236 902,236 H 316 Q 308,236 308,244 V 312"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="581" y="216" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="609" y="225" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JOB.JSON</text>

      <!-- MESH: Mesh -> Device Solvers -->
      <path d="M 308,376 V 392 Q 308,400 316,400 H 444 Q 452,400 452,408 V 424"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="360" y="380" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="380" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MESH</text>

      <!-- PHYSICS: Device Physics -> Device Solvers -->
      <path d="M 816,376 V 392 Q 816,400 808,400 H 636 Q 628,400 628,408 V 424"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="694" y="380" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="722" y="389" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PHYSICS</text>

      <!-- SIZE GATE: Device Physics -> MPI Schwarz Pool (dashed, straight, conditional branch) -->
      <path d="M 888,376 V 536" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="898" y="448" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="924" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">&gt;20K·3D</text>

      <!-- NEWTON: Device Solvers -> Linear Algebra (same x, straight, per-iterate call) -->
      <line x1="580" y1="488" x2="580" y2="536" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="588" y="508" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="612" y="517" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEWTON</text>

      <!-- NPZ: Device Solvers -> Result / Output Store -->
      <path d="M 712,488 V 616 Q 712,624 704,624 H 360 Q 352,624 352,632 V 672"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="722" y="548" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="738" y="557" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NPZ</text>

      <!-- NPZ: MPI Schwarz Pool -> Result / Output Store (same result-dict shape, no branching) -->
      <path d="M 888,600 V 632 Q 888,640 880,640 H 432 Q 424,640 424,648 V 672"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="898" y="608" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="914" y="617" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NPZ</text>

      <!-- FINISHED: Result / Output Store -> App Layer (dashed return, exits top edge to clear Visualization) -->
      <path d="M 460,672 V 664 Q 460,656 468,656 H 1144 Q 1152,656 1152,648 V 136 Q 1152,128 1144,128 H 1072"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="774" y="636" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="806" y="645" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FINISHED</text>

      <!-- STORE: App Layer -> Visualization Pipeline -->
      <path d="M 1040,160 V 696 Q 1040,704 1032,704 H 880"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1050" y="420" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1072" y="429" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STORE</text>

      <!-- DISPLAY: Visualization Pipeline -> QML/UI Layer (closes the loop, routed around the left margin) -->
      <path d="M 772,736 V 752 Q 772,760 764,760 H 24 Q 16,760 16,752 V 136 Q 16,128 24,128 H 88"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="366" y="740" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="394" y="749" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPLAY</text>

      <!-- ===== NODES ===== -->

      <!-- QML/UI Layer -->
      <rect x="88" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="88" y="96" width="216" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="96" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="110" y="113" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GUI</text>
      <text x="196" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">QML / UI Layer</text>
      <text x="196" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gui/qml/*.qml</text>

      <!-- Python App Layer (FOCAL) -->
      <rect x="856" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="856" y="96" width="216" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="864" y="104" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="878" y="113" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="964" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Python App Layer</text>
      <text x="964" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">app_controller.py · QProcess</text>

      <!-- Mesh Subsystem -->
      <rect x="200" y="312" width="216" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="312" width="216" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="208" y="320" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="222" y="329" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MSH</text>
      <text x="308" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mesh Subsystem</text>
      <text x="308" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mesh2d.py · mesh3d.py</text>

      <!-- Device Physics -->
      <rect x="744" y="312" width="216" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="312" width="216" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="752" y="320" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="766" y="329" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MAT</text>
      <text x="852" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Device Physics</text>
      <text x="852" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">materials.py · ionization.py</text>

      <!-- Device Solvers 2D/3D (FOCAL) -->
      <rect x="440" y="424" width="280" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="424" width="280" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="448" y="432" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="462" y="441" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SLV</text>
      <text x="580" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Device Solvers · 2D/3D</text>
      <text x="580" y="476" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">device2d.py · device3d.py</text>

      <!-- Linear Algebra -->
      <rect x="464" y="536" width="232" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="536" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="472" y="544" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="486" y="553" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LIN</text>
      <text x="580" y="572" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Linear Algebra</text>
      <text x="580" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">linsolve.py (size-gated)</text>

      <!-- MPI Schwarz Pool (OPTIONAL / conditional) -->
      <rect x="772" y="536" width="232" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="772" y="536" width="232" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="780" y="544" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="794" y="553" fill="rgba(45,49,66,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MPI</text>
      <text x="888" y="572" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MPI Schwarz Pool</text>
      <text x="888" y="588" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mpi_schwarz_runner.py ×4</text>

      <!-- Result / Output Store -->
      <rect x="280" y="672" width="216" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="672" width="216" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="288" y="680" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="302" y="689" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
      <text x="388" y="708" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Result / Output Store</text>
      <text x="388" y="724" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">result_store.py · .npz</text>

      <!-- Visualization Pipeline -->
      <rect x="664" y="672" width="216" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="664" y="672" width="216" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="672" y="680" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="686" y="689" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VIZ</text>
      <text x="772" y="708" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Visualization Pipeline</text>
      <text x="772" y="724" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mpl_canvas_item.py · viewer3d.py</text>

      <!-- ===== LEGEND ===== -->
      <line x1="40" y1="808" x2="1160" y2="808" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="824" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="840" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="848" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Core engine</text>

      <rect x="188" y="840" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="208" y="848" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend module</text>

      <rect x="336" y="840" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="356" y="848" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Result store</text>

      <rect x="484" y="840" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="504" y="848" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">UI layer</text>

      <rect x="632" y="840" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="652" y="848" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Optional / size-gated</text>

      <line x1="808" y1="845" x2="836" y2="845" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="844" y="848" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary action</text>

      <line x1="960" y1="845" x2="988" y2="845" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="996" y="848" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Process / async</text>
    </svg>
