<text x="520" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Semiconductor Workbench</text>
<text x="520" y="548" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">core · adapters · solvers · analysis</text>

<!-- Numerical Core (FOCAL) -->
<rect x="352" y="632" width="336" height="64" rx="6" fill="#f5f5f5"/>
<rect x="352" y="632" width="336" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="360" y="640" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
