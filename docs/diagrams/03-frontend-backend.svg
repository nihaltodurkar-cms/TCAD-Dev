<rect x="88" y="360" width="280" height="64" rx="6" fill="#f5f5f5"/>
<rect x="88" y="360" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="96" y="368" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
