<text x="520" y="668" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Numerical Core (frozen)</text>
<text x="520" y="684" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">pytcad/pytcad/* &#8212; mesh · device · linsolve</text>

