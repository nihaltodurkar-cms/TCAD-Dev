<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fb-title fb-desc">
<title id="fb-title">Frontend to backend layering</title>
<desc id="fb-desc">Architecture diagram showing QML calling controllers, controllers calling services, and both services and the visualization canvas reaching the numerical core only through the workbench domain layer, never directly.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- arrows -->
<line x1="228" y1="152" x2="228" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="238" y="180" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="258" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">CALLS</text>

<line x1="228" y1="288" x2="228" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
