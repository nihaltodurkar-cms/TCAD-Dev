<rect x="232" y="580" width="60" height="12" rx="2" fill="#f5f5f5"/>
<text x="262" y="589" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">BUILD DEV</text>

<path d="M 756,152 V 316 Q 756,324 748,324 H 584 Q 576,324 576,332 V 496"
      fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="642" y="304" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="670" y="313" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">OBSERVE</text>

<line x1="520" y1="560" x2="520" y2="632" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow)"/>
