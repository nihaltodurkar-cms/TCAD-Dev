<text x="268" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">DISPATCH</text>

<line x1="368" y1="120" x2="616" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="472" y="100" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="492" y="109" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">EMBED</text>

<path d="M 181,424 V 440 Q 181,448 189,448 H 456 Q 464,448 464,456 V 496"
      fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="298" y="428" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="330" y="437" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">MATERIALS</text>

<path d="M 140,424 V 592 Q 140,600 148,600 H 372 Q 380,600 380,608 V 632"
