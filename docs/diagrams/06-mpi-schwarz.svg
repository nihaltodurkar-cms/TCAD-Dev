<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mpi-title mpi-desc">
<title id="mpi-title">MPI Schwarz domain decomposition</title>
<desc id="mpi-desc">Deployment diagram showing four MPI ranks each solving a local Device3D slab and exchanging interior-plane data with neighbors, then rank 0 gathering and reassembling the result into the same result-extraction path as the single-process solve.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- exchange arrows: bidirectional (marker at both ends), same y -->
<line x1="232" y1="152" x2="280" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="232" y="132" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="256" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">&#968;,n,p</text>

<line x1="472" y1="152" x2="520" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="472" y="132" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="496" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">&#968;,n,p</text>

<line x1="712" y1="152" x2="760" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="712" y="132" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="736" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">&#968;,n,p</text>

<!-- Rank0 -> Gather -->
<path d="M 136,184 V 216 Q 136,224 144,224 H 488 Q 496,224 496,232 V 264"
      fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="288" y="204" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="316" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">GATHER</text>

<!-- Gather -> Reassemble -->
<line x1="496" y1="328" x2="496" y2="408" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="504" y="356" width="40" height="12" rx="2" fill="#f5f5f5"/>
<text x="524" y="365" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">CORE</text>

<!-- Reassemble -> Result -->
<line x1="496" y1="472" x2="496" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="504" y="500" width="32" height="12" rx="2" fill="#f5f5f5"/>
<text x="520" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">NPZ</text>

<!-- Rank nodes -->
<rect x="40" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="40" y="120" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="48" y="128" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="66" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">RANK 0</text>
<text x="136" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Device3D slab</text>
<text x="136" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">local direct solve</text>

<rect x="280" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="280" y="120" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="288" y="128" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="306" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">RANK 1</text>
<text x="376" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Device3D slab</text>
<text x="376" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">local direct solve</text>

<rect x="520" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="520" y="120" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="528" y="128" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="546" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">RANK 2</text>
<text x="616" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Device3D slab</text>
<text x="616" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">local direct solve</text>

<rect x="760" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="760" y="120" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="768" y="128" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="786" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">RANK 3</text>
<text x="856" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Device3D slab</text>
<text x="856" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">local direct solve</text>

<!-- Gather -->
<rect x="376" y="264" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="376" y="264" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="384" y="272" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="398" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">R0</text>
<text x="496" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Gather core blocks</text>
<text x="496" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">comm.gather, rank 0 only</text>

<!-- Reassemble (FOCAL) -->
<rect x="376" y="408" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="376" y="408" width="240" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="384" y="416" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
<text x="398" y="425" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">R0</text>
<text x="496" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Reassemble + extract</text>
<text x="496" y="460" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">register_contacts &#183; extract_result (shared)</text>

<!-- Result -->
<rect x="376" y="552" width="240" height="64" rx="6" fill="#f5f5f5"/>
<rect x="376" y="552" width="240" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="384" y="560" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
<text x="398" y="569" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">OUT</text>
<text x="496" y="588" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Result .npz</text>
<text x="496" y="604" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">same schema as single-process path</text>

<!-- legend -->
<line x1="40" y1="656" x2="1000" y2="656" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="672" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".18em">LEGEND</text>
<rect x="40" y="684" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="60" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">MPI rank / worker</text>
<rect x="220" y="684" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="240" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Correctness-critical step</text>
<rect x="420" y="684" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="440" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Result store</text>
<line x1="580" y1="689" x2="608" y2="689" stroke="#4f5d75" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="616" y="692" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">MPI point-to-point exchange</text>
</svg>
