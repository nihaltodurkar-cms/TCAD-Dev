<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1744 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dflow-title dflow-desc">
<title id="dflow-title">Data lifecycle from input to visualization</title>
<desc id="dflow-desc">Data flow diagram tracing an object's representation from UI input through a serialized job file, in-memory mesh and simulation state, an atomically-written result file, back to in-memory result objects and visualization, with dashed arrows marking process-boundary crossings.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- arrows, all y=152 straight, gap=72 between nodes -->
<line x1="216" y1="152" x2="288" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="220" y="132" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="252" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">SERIALIZE</text>

<line x1="464" y1="152" x2="536" y2="152" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="468" y="132" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="500" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">BUILD</text>

<line x1="712" y1="152" x2="784" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="716" y="132" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="748" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">SOLVE</text>

<line x1="960" y1="152" x2="1032" y2="152" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="964" y="132" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="996" y="141" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">SAVEZ</text>

<line x1="1208" y1="152" x2="1280" y2="152" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<rect x="1212" y="132" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="1244" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">LOAD</text>

<line x1="1456" y1="152" x2="1528" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="1460" y="132" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="1492" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">RENDER</text>

<!-- 1 UI Input -->
<rect x="40" y="120" width="176" height="64" rx="6" fill="#f5f5f5"/>
<rect x="40" y="120" width="176" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="128" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">UI Input</text>
<text x="128" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">StructureModel</text>

<!-- 2 Job Config (store) -->
<rect x="288" y="120" width="176" height="64" rx="6" fill="#f5f5f5"/>
<rect x="288" y="120" width="176" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="376" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Job Config</text>
<text x="376" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">job-{uuid}.json</text>

<!-- 3 Mesh (backend) -->
<rect x="536" y="120" width="176" height="64" rx="6" fill="#f5f5f5"/>
<rect x="536" y="120" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="624" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Mesh</text>
<text x="624" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">in-memory, subprocess</text>

<!-- 4 Simulation State (backend) -->
<rect x="784" y="120" width="176" height="64" rx="6" fill="#f5f5f5"/>
<rect x="784" y="120" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="872" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Simulation State</text>
<text x="872" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">&#968;, n, p arrays</text>

<!-- 5 Result File (FOCAL) -->
<rect x="1032" y="120" width="176" height="64" rx="6" fill="#f5f5f5"/>
<rect x="1032" y="120" width="176" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="1120" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Result File</text>
<text x="1120" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">.npz, atomic write</text>

<!-- 6 Result Objects (backend) -->
<rect x="1280" y="120" width="176" height="64" rx="6" fill="#f5f5f5"/>
<rect x="1280" y="120" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="1368" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Result Objects</text>
<text x="1368" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">NpzResultStore</text>

<!-- 7 Visualization -->
<rect x="1528" y="120" width="176" height="64" rx="6" fill="#f5f5f5"/>
<rect x="1528" y="120" width="176" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="1616" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Visualization</text>
<text x="1616" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">canvas · 3D viewer</text>

<!-- legend -->
<line x1="40" y1="216" x2="1704" y2="216" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".18em">LEGEND</text>
<rect x="40" y="244" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="60" y="252" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Persistent artifact</text>
<rect x="240" y="244" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="260" y="252" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">In-memory object</text>
<rect x="440" y="244" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="460" y="252" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Filesystem object</text>
<rect x="640" y="244" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="660" y="252" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">UI-facing</text>
<line x1="800" y1="249" x2="828" y2="249" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="836" y="252" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Crosses process boundary</text>
</svg>
