<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulation Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36;--sans:'Geist',sans-serif;--serif:'Instrument Serif',serif;--mono:'Geist Mono',monospace}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1360px;width:100%}
.eyebrow{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:var(--serif);font-size:clamp(1.5rem,2.4vw + .75rem,2rem);font-weight:400;letter-spacing:-.02em;color:var(--ink);margin-bottom:1rem}
svg{width:100%;min-width:960px;display:block}
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Process · Diagram Design</p>
<h1>Simulation pipeline</h1>
<svg viewBox="0 0 1552 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipe-title pipe-desc">
<title id="pipe-title">Simulation pipeline</title>
<desc id="pipe-desc">Process diagram showing the simulation pipeline from geometry input through meshing, materials and physics, device formulation, nonlinear solution, to results.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- arrows: all same y=152, straight, gap=64 between nodes -->
<line x1="232" y1="152" x2="296" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="236" y="132" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="264" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">RASTERIZE</text>

<line x1="488" y1="152" x2="552" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="492" y="132" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="520" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">GRID+DOF</text>

<line x1="744" y1="152" x2="808" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="748" y="132" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="776" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">MODELS</text>

<line x1="1000" y1="152" x2="1064" y2="152" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="1004" y="132" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="1032" y="141" fill="#eb6c36" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">F, J</text>

<line x1="1256" y1="152" x2="1320" y2="152" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="1260" y="132" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="1288" y="141" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".06em">DONE</text>

<!-- nodes: row y=120 h=64, width192, gap64 -->
<!-- 1 Geometry/Input -->
<rect x="40" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="40" y="120" width="192" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<rect x="48" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
<text x="62" y="137" fill="#7a8399" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">IN</text>
<text x="136" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Geometry / Input</text>
<text x="136" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">StructureModel · Region</text>

<!-- 2 Mesh -->
<rect x="296" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="296" y="120" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="304" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="318" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">MSH</text>
<text x="392" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Mesh</text>
<text x="392" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Mesh2D/3D · idx(i,j,k)</text>

<!-- 3 Materials/Physics -->
<rect x="552" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="552" y="120" width="192" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="560" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="574" y="137" fill="#2d3142" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">MAT</text>
<text x="648" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Materials &amp; Physics</text>
<text x="648" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Semiconductor · ionization · btbt</text>

<!-- 4 Device Formulation (FOCAL) -->
<rect x="808" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="808" y="120" width="192" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="816" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
<text x="830" y="137" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">DEV</text>
<text x="904" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Device Formulation</text>
<text x="904" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Device1D/2D/3D · BCs</text>

<!-- 5 Nonlinear Solution (FOCAL) -->
<rect x="1064" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="1064" y="120" width="192" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="1072" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
<text x="1086" y="137" fill="#eb6c36" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">SLV</text>
<text x="1160" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Nonlinear Solution</text>
<text x="1160" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">Newton &#215; linsolve.py</text>

<!-- 6 Results -->
<rect x="1320" y="120" width="192" height="64" rx="6" fill="#f5f5f5"/>
<rect x="1320" y="120" width="192" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="1328" y="128" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
<text x="1342" y="137" fill="#4f5d75" font-size="7" font-family="'Geist Mono',monospace" text-anchor="middle" letter-spacing=".08em">OUT</text>
<text x="1416" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist',sans-serif" text-anchor="middle">Results</text>
<text x="1416" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono',monospace" text-anchor="middle">.npz · ResultStore</text>

<!-- legend -->
<line x1="40" y1="232" x2="1512" y2="232" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="248" fill="#4f5d75" font-size="8" font-family="'Geist Mono',monospace" letter-spacing=".18em">LEGEND</text>
<rect x="40" y="260" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="60" y="268" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Newton-coupled stage</text>
<rect x="260" y="260" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280" y="268" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Backend module</text>
<rect x="440" y="260" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="460" y="268" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Result store</text>
<rect x="600" y="260" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="620" y="268" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">UI input</text>
<line x1="740" y1="265" x2="768" y2="265" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="776" y="268" fill="#4f5d75" font-size="8.5" font-family="'Geist',sans-serif">Per-iterate Jacobian assembly</text>
</svg>
</div>
</body>
</html>
