# CI for pyTCAD.
#
# The repo had no CI at all: the "N passed, zero warnings" invariant in
# AGENTS.md was enforced by whoever remembered to run the suite.  This
# makes it automatic.
#
# Two properties are non-negotiable and each has its own job:
#
#   * The pure-Python path must work with NO compiler and NO extension.
#     That is the migration's undo button (gate G-F) -- `python-only`
#     builds nothing and must be fully green on its own.
#
#   * The compiled path must produce identical results, not merely
#     working ones -- `accelerated` builds the extension and reruns the
#     same suite with PYTCAD_ACCEL=1.
#
# Both run from pytcad/, which is the project root for this repo (see
# AGENTS.md "Commands").  OPENBLAS_NUM_THREADS=1 is set for the same
# reason AGENTS.md documents it: without it numpy's BLAS spawns a thread
# pool per xdist worker and oversubscribes the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  python-only:
    name: pure Python (no extension)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # PySide6 needs these even for QT_QPA_PLATFORM=offscreen, which
      # gui/tests/conftest.py sets for itself. A bare runner has none of
      # them and the GUI suite fails at import with a bare "could not
      # load the Qt platform plugin".
      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Install
        working-directory: pytcad
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Assert the extension really is absent
        working-directory: pytcad
        run: |
          python -c "from pytcad import _accel; assert not _accel.HAVE_ACCEL, _accel.status(); print(_accel.status())"
      - name: Fast suite
        working-directory: pytcad
        run: python -m pytest tests/ gui/tests/ -n 4 -m "not slow" -q
      - name: Slow gate battery
        working-directory: pytcad
        run: python -m pytest tests/ gui/tests/ -n 4 -m "slow" -q

  accelerated:
    name: compiled kernels (PYTCAD_ACCEL=1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: lukka/get-cmake@latest
      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Install
        working-directory: pytcad
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nanobind scikit-build-core
      - name: Build the extension in place
        working-directory: pytcad
        run: |
          cmake -S core -B build/dev -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DTCAD_INPLACE_OUTPUT=ON \
                -DPython_EXECUTABLE="$(which python)"
          cmake --build build/dev
          python -c "from pytcad import _accel; assert _accel.HAVE_ACCEL; print(_accel.status())"
      # Same suite, compiled path. Results must be identical, not merely
      # passing -- the parity tests assert np.array_equal against the
      # Python reference, which is why both jobs run the whole thing.
      - name: Fast suite, accelerated
        working-directory: pytcad
        env:
          PYTCAD_ACCEL: "1"
        run: python -m pytest tests/ gui/tests/ -n 4 -m "not slow" -q
      - name: Boundary and parity gates
        working-directory: pytcad
        env:
          PYTCAD_ACCEL: "1"
        run: python -m pytest tests/test_accel_boundary.py tests/test_architecture_boundaries.py -q

  wheel:
    name: wheel builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: lukka/get-cmake@latest
      - name: Build
        working-directory: pytcad
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pytcad-wheel
          path: pytcad/dist/*.whl
