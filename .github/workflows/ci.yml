# CI for pyTCAD.
#
# The repo had no CI at all: the "N passed, zero warnings" invariant in
# CLAUDE.md was enforced by whoever remembered to run the suite.  This
# makes it automatic.
#
# Two properties are non-negotiable and each has its own job:
#
#   * The pure-Python path must work with NO compiler and NO extension.
#     That is the migration's undo button (gate G-F) -- `python-only`
#     builds nothing and must be fully green on its own.
#
#   * The compiled path must produce identical results, not merely
#     working ones -- `accelerated` builds the extension and reruns the
#     same suite with PYTCAD_ACCEL=1.
#
# Both run from pytcad/, which is the project root for this repo (see
# CLAUDE.md "Commands").  OPENBLAS_NUM_THREADS=1 is set for the same
# reason CLAUDE.md documents it: without it numpy's BLAS spawns a thread
# pool per xdist worker and oversubscribes the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  python-only:
    name: pure Python (no extension)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # PySide6 needs these even for QT_QPA_PLATFORM=offscreen, which
      # gui/tests/conftest.py sets for itself. A bare runner has none of
      # them and the GUI suite fails at import with a bare "could not
      # load the Qt platform plugin".
      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Install
        working-directory: pytcad
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Assert the extension really is absent
        working-directory: pytcad
        run: |
          python -c "from pytcad import _accel; assert not _accel.HAVE_ACCEL, _accel.status(); print(_accel.status())"
      - name: Fast suite
        working-directory: pytcad
        run: python -m pytest tests/ gui/tests/ -n 4 -m "not slow" -q
      - name: Slow gate battery
        working-directory: pytcad
        run: python -m pytest tests/ gui/tests/ -n 4 -m "slow" -q

  accelerated:
    name: compiled kernels (PYTCAD_ACCEL=1)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: lukka/get-cmake@latest
      - name: Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - name: Install
        working-directory: pytcad
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nanobind scikit-build-core
      - name: Build the extension in place
        working-directory: pytcad
        run: |
          cmake -S core -B build/dev -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DTCAD_INPLACE_OUTPUT=ON \
                -DPython_EXECUTABLE="$(which python)"
          cmake --build build/dev
          python -c "from pytcad import _accel; assert _accel.HAVE_ACCEL; print(_accel.status())"
      # Same suite, compiled path. Results must be identical, not merely
      # passing -- the parity tests assert np.array_equal against the
      # Python reference, which is why both jobs run the whole thing.
      - name: Fast suite, accelerated
        working-directory: pytcad
        env:
          PYTCAD_ACCEL: "1"
        run: python -m pytest tests/ gui/tests/ -n 4 -m "not slow" -q
      - name: Boundary and parity gates
        working-directory: pytcad
        env:
          PYTCAD_ACCEL: "1"
        run: python -m pytest tests/test_accel_boundary.py tests/test_architecture_boundaries.py -q
      # The G-E throughput floors are marked slow, and the `python-only`
      # job's slow battery skips this whole file (there is no extension
      # there to measure). So without this step they run nowhere and
      # would rot silently. The floors are absolute and set ~4x under the
      # measured rates, so a slower CI runner does not trip them.
      - name: Throughput floors (G-E)
        working-directory: pytcad
        env:
          PYTCAD_ACCEL: "1"
        run: python -m pytest tests/test_accel_parity.py -q -m slow
      # M32. Not a timing gate -- a CI runner's absolute speed is not
      # reproducible enough to assert on, and a threshold that fails on a
      # noisy runner teaches everyone to ignore it. What this proves is
      # that every case still BUILDS AND RUNS and that the dashboard is
      # still produced, which is what stops the suite rotting the way the
      # G-E floors above silently did.
      - name: Benchmark suite runs (M32)
        working-directory: pytcad
        run: |
          python -m benchmarks --json benchmark-report.json --out benchmark-report.md
          cat benchmark-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            pytcad/benchmark-report.md
            pytcad/benchmark-report.json

  # The two jobs above both build WITHOUT PETSc -- pip has no practical
  # PETSc wheel, which is exactly why M31-CPP-ARCHITECTURE-PLAN.md sec 2
  # names conda-forge as the supported channel for the C++ build. That
  # makes `accelerated` above the standing proof that the PETSc-less
  # configuration works, and this job the only place the compiled solver
  # backend (P3b) is exercised at all. Without it, tests/
  # test_accel_parity.py's petsc gates would skip in CI forever and
  # nobody would notice they had stopped running.
  petsc:
    name: compiled PETSc backend (conda-forge)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}       # -l so conda's env activation is applied
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          miniforge-version: latest
          activate-environment: tcad
      - name: Install PETSc, petsc4py and the build toolchain
        run: |
          conda install -y -c conda-forge petsc petsc4py pkg-config cmake ninja \
                                          numpy scipy nanobind
          pip install pytest pytest-xdist pytest-timeout
      - name: Build the extension against PETSc
        working-directory: pytcad
        run: |
          cmake -S core -B build/dev -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DTCAD_INPLACE_OUTPUT=ON \
                -DTCAD_WITH_PETSC=ON \
                -DPython_EXECUTABLE="$(which python)"
          cmake --build build/dev
          python -c "from pytcad import _accel; assert _accel.have_petsc(), _accel.status(); print(_accel.status())"
      # Only the solver gates: this environment deliberately does not
      # install the GUI or meshing extras, so the full suite is not what
      # it is here to prove. What it proves is that the compiled backend
      # is bit-identical to petsc4py, which is a claim that can only be
      # checked where BOTH exist.
      - name: Solver parity gates
        working-directory: pytcad
        run: |
          python -m pytest tests/test_accel_parity.py -q -k petsc
          python -m pytest tests/test_m22_linsolve.py tests/test_accel_boundary.py -q

  wheel:
    name: wheel builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: lukka/get-cmake@latest
      - name: Build
        working-directory: pytcad
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          ls -la dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pytcad-wheel
          path: pytcad/dist/*.whl
