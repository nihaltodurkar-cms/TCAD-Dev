# Test-suite policy (v0.5.x): the ONLY exempted warning is listed below;
# anything new shows up in the warnings summary and must be fixed at the
# source or asserted with pytest.warns() in the test that intends it.
# (A blanket `error` policy was tried and rejected: a warning raised as
# an exception inside Qt/QML marshaling segfaults the process instead of
# failing cleanly.)
#
# Known exemption:
#   Device2D's constructor warns once per build of the shipped 2D
#   MOSFET example (source/drain doping 1e20 cm^-3 > 1e19) that Boltzmann
#   statistics make degenerate regions qualitative.  Correct, intentional
#   physics advice -- but emitted at CONSTRUCTION time, so dozens of
#   tests that merely load the example (round-trips, GUI panels,
#   persistence) would each spam it while testing nothing about it.
#   Tests that specifically exercise degenerate doping assert this
#   warning themselves (see tests/test_validation_2d.py).
[pytest]
filterwarnings =
    ignore:Doping exceeds ~1e19 cm\^-3:UserWarning
markers =
    slow: multi-minute gates (M15 breakdown ramps).  Deselect with
        `-m "not slow"`; they are part of the milestone gate battery
        and must run before any M15 completion claim.
